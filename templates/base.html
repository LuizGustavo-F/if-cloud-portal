{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block titulo %}IFMT Cloud{% endblock %}</title>
    <style>
        /* TEMA DARK GLOBAL */
        :root {
            --bg-body: #111111;
            --bg-card: #181b1f;
            --border-color: #2c3235;
            --text-main: #cccccd;
            --text-title: #ffffff;
            --primary-color: #1abc9c;
            --primary-hover: #16a085;
            --danger-color: #e74c3c;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-body); 
            margin: 0; 
            color: var(--text-main); 
        }
        
        /* Navbar Dark */
        .navbar { 
            background-color: var(--bg-card); 
            padding: 15px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid var(--border-color); 
        }
        .navbar a { 
            color: var(--text-main); 
            text-decoration: none; 
            font-weight: bold; 
            margin-left: 20px; 
            transition: 0.2s; 
        }
        .navbar a:hover { color: var(--primary-color); }
        
        /* Container Central Dark */
        .container { 
            max-width: 800px; 
            margin: 40px auto; 
            background: var(--bg-card); 
            padding: 30px; 
            border-radius: 8px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.5); 
            border: 1px solid var(--border-color); 
        }
        
        h1, h2, h3 { color: var(--text-title); }
        
        /* Botões */
        .btn { 
            background-color: var(--primary-color); 
            color: #111; 
            padding: 10px 20px; 
            text-decoration: none; 
            border-radius: 5px; 
            font-weight: bold; 
            display: inline-block; 
            border: none; 
            cursor: pointer; 
            transition: 0.2s; 
        }
        .btn:hover { background-color: var(--primary-hover); }
        
        label { font-weight: bold; margin-top: 15px; display: block; color: #8e96a3; }
        input, select { 
            width: 100%; 
            padding: 10px; 
            margin-top: 5px; 
            background-color: var(--bg-body); /* Fundo do input mais escuro que o card */
            color: var(--text-title); 
            border: 1px solid var(--border-color); 
            border-radius: 5px; 
            box-sizing: border-box; 
        }
        input:focus, select:focus { outline: none; border-color: var(--primary-color); }
        
        .alerta { background-color: rgba(46, 204, 113, 0.1); color: #2ecc71; padding: 15px; border-radius: 5px; border-left: 5px solid #2ecc71; margin-top: 20px;}
        .erro { background-color: rgba(231, 76, 60, 0.1); color: var(--danger-color); padding: 15px; border-radius: 5px; border-left: 5px solid var(--danger-color); margin-top: 20px;}
        
        .btn-sair { 
            background: none; 
            border: none; 
            color: var(--text-main); 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 16px; 
            margin-left: 20px; 
            font-family: inherit; 
            padding: 0; 
            text-decoration: none; 
            transition: 0.2s; 
        }
        .btn-sair:hover { color: var(--danger-color); }
        
        .btn-admin { 
            background-color: transparent; 
            padding: 6px 12px; 
            border-radius: 4px; 
            border: 1px solid var(--primary-color); 
            color: var(--primary-color) !important; 
            transition: 0.2s; 
        }
        .btn-admin:hover { 
            background-color: var(--primary-color); 
            color: #111 !important; 
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div style="font-size: 1.2em; font-weight: bold;">
            <a href="{% url 'landing' %}" style="margin-left: 0; color: #1abc9c;">☁️ IFMT Cloud</a>
        </div>
        
        <div style="display: flex; align-items: center;">
            
            {% if user.is_authenticated %}
                <a href="{% url 'painel_maquinas' %}">Meu Painel</a>
                <a href="{% url 'criar_vm' %}">Nova Máquina</a>
                
                {% if user.is_staff %}
                    <a href="{% url 'visao_global' %}" class="btn-admin">🌍 Visão Global</a>
                {% endif %}
                
                <span style="margin-left: 20px; color: #56CCF2;">| Olá, @{{ user.username }}</span>
                <form action="{% url 'logout' %}" method="post" style="margin: 0;">
                    {% csrf_token %}
                    <button type="submit" class="btn-sair">Sair</button>
                </form>
            
            {% else %}
                <img src="{% static 'logo-png-if.png' %}" alt="Logo IFMT" height="40" style="margin-left: 20px;">
            {% endif %}
            
        </div>
    </div>
    
    <div class="container">
        {% block conteudo %}
        {% endblock %}
    </div>
</body>
</html>
